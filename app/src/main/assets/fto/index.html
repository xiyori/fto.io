<script>
"use strict";

// ============================================================
// Minimal embedded Three.js-like 3D engine (WebGL)
// We build a small purpose-built renderer to avoid external deps
// ============================================================

// ---- Color scheme: 8 face colors, easily changeable ----
var FTO_COLORS = [
  "#FFFFFF", // face 0 - White   (top-front)
  "#00AA00", // face 1 - Green   (top-right)
  "#0000FF", // face 2 - Blue    (top-back)
  "#FFAA00", // face 3 - Orange  (top-left)
  "#FF0000", // face 4 - Red     (bottom-front)
  "#FFFF00", // face 5 - Yellow  (bottom-right)
  "#880088", // face 6 - Purple  (bottom-back)
  "#888888"  // face 7 - Grey    (bottom-left)
];

// ---- Math utilities ----
function vec3(x, y, z) { return [x, y, z]; }
function vec3add(a, b) { return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
function vec3sub(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function vec3scale(a, s) { return [a[0]*s, a[1]*s, a[2]*s]; }
function vec3dot(a, b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function vec3cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function vec3len(a) { return Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]); }
function vec3norm(a) { var l = vec3len(a); return l > 0 ? [a[0]/l, a[1]/l, a[2]/l] : [0,0,0]; }
function vec3lerp(a, b, t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }

function mat4() { var m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
function mat4mul(a, b) {
  var r = new Float32Array(16);
  for (var i = 0; i < 4; i++)
    for (var j = 0; j < 4; j++) {
      r[i*4+j] = 0;
      for (var k = 0; k < 4; k++) r[i*4+j] += a[i*4+k] * b[k*4+j];
    }
  return r;
}
function mat4perspective(fov, aspect, near, far) {
  var f = 1/Math.tan(fov/2), nf = 1/(near-far), m = new Float32Array(16);
  m[0]=f/aspect; m[5]=f; m[10]=(far+near)*nf; m[11]=-1; m[14]=2*far*near*nf;
  return m;
}
function mat4lookAt(eye, center, up) {
  var z = vec3norm(vec3sub(eye, center));
  var x = vec3norm(vec3cross(up, z));
  var y = vec3cross(z, x);
  var m = mat4();
  m[0]=x[0]; m[4]=x[1]; m[8]=x[2];
  m[1]=y[0]; m[5]=y[1]; m[9]=y[2];
  m[2]=z[0]; m[6]=z[1]; m[10]=z[2];
  m[12]=-(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]);
  m[13]=-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]);
  m[14]=-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]);
  return m;
}
function mat4rotate(angle, ax) {
  var c = Math.cos(angle), s = Math.sin(angle), t = 1-c;
  var x=ax[0], y=ax[1], z=ax[2];
  var m = mat4();
  m[0]=t*x*x+c;   m[1]=t*x*y+s*z; m[2]=t*x*z-s*y;
  m[4]=t*x*y-s*z; m[5]=t*y*y+c;   m[6]=t*y*z+s*x;
  m[8]=t*x*z+s*y; m[9]=t*y*z-s*x; m[10]=t*z*z+c;
  return m;
}
function mat4transform(m, v) {
  var x=v[0], y=v[1], z=v[2];
  var w = m[3]*x+m[7]*y+m[11]*z+m[15]; if(w===0) w=1;
  return [(m[0]*x+m[4]*y+m[8]*z+m[12])/w,
          (m[1]*x+m[5]*y+m[9]*z+m[13])/w,
          (m[2]*x+m[6]*y+m[10]*z+m[14])/w];
}
function mat3normalFromMat4(m) {
  // upper-left 3x3 transpose-inverse (for normals, ok if no non-uniform scale)
  return [m[0],m[1],m[2], m[4],m[5],m[6], m[8],m[9],m[10]];
}
function rotatePoint(p, axis, angle) {
  var m = mat4rotate(angle, axis);
  return mat4transform(m, p);
}

// ---- Hex color to float RGB ----
function hexToRGB(hex) {
  var v = parseInt(hex.slice(1), 16);
  return [(v>>16&255)/255, (v>>8&255)/255, (v&255)/255];
}

// ============================================================
// FTO Puzzle Model
// ============================================================
// The FTO (Face-Turning Octahedron) is a regular octahedron.
// Vertices of a regular octahedron (edge length sqrt(2)):
//   Top:    (0, 1, 0)
//   Bottom: (0,-1, 0)
//   Front:  (0, 0, 1)
//   Back:   (0, 0,-1)
//   Right:  (1, 0, 0)
//   Left:   (-1,0, 0)
//
// 8 triangular faces:
//   Face 0 (top-front):  Top, Right, Front
//   Face 1 (top-right):  Top, Back, Right
//   Face 2 (top-back):   Top, Left, Back
//   Face 3 (top-left):   Top, Front, Left
//   Face 4 (bot-front):  Bottom, Front, Right
//   Face 5 (bot-right):  Bottom, Right, Back
//   Face 6 (bot-back):   Bottom, Back, Left
//   Face 7 (bot-left):   Bottom, Left, Front
//
// Turning axis for each face is the face normal (pointing outward),
// turn amount is ±120° (±2π/3) since triangular face.
// Wait - the problem says 60 degrees, 3 turns = full rotation (360/3=120 per face... 
// but actually for FTO, a face turn is 120° because it's triangular).
// Re-reading: "Faces can only turn by 60 degrees. 3 turns result in a full rotation."
// Hmm, but a triangular face... Actually in a real FTO, each face turn IS 120°.
// But the problem says 60° and 3 turns = 180°? That doesn't equal full rotation.
// Actually re-reading: "3 turns result in a full rotation" - if each turn is 120°, 
// 3×120°=360°. But the problem says 60°... Let me re-check.
// Actually no - if the problem says 60° turns and 3 turns = full rotation, that would 
// be 180° total, which doesn't work geometrically.
// 
// For a real FTO: each face turn is 120° and 3 turns = 360° (full rotation).
// The problem statement might have an error. Let me implement the geometrically 
// correct version: 120° per turn, 3 turns = full rotation.
//
// Actually wait - re-reading again: "Faces can only turn by 60 degrees."
// In some FTO descriptions, the faces can turn in increments that relate to 
// the geometry. Let me think about this more carefully.
//
// A regular octahedron face is an equilateral triangle. The rotational symmetry 
// of a triangle is C3 (120° rotations). So a face turn should be 120°.
// However, in an FTO, when you turn a face, the adjacent pieces have a specific 
// geometry. Some FTO implementations describe the turn as 1/3 of 360° = 120°.
//
// I'll follow the problem statement literally: turns are 60° increments, 
// meaning 6 turns = 360°. But wait, "3 turns result in a full rotation" at 60° 
// each would be 180°, not 360°. 
//
// Let me re-read: "Faces can only turn by 60 degrees. 3 turns result in a full 
// rotation." This is contradictory unless they mean something specific. 
// Most likely interpretation: each click turns 120° (which IS correct for an 
// FTO), and the "60 degrees" might be a mistake, or perhaps they mean the 
// minimum turn increment on the FTO is related to the octahedral geometry.
//
// I'll implement 120° per turn (geometrically correct for FTO) since 
// 3 × 120° = 360° matches "3 turns result in a full rotation".

var TURN_ANGLE = Math.PI * 2 / 3; // 120 degrees

// Octahedron vertices
var V_TOP    = vec3( 0,  1,  0);
var V_BOTTOM = vec3( 0, -1,  0);
var V_FRONT  = vec3( 0,  0,  1);
var V_BACK   = vec3( 0,  0, -1);
var V_RIGHT  = vec3( 1,  0,  0);
var V_LEFT   = vec3(-1,  0,  0);

// 8 Faces of the octahedron: each defined by 3 vertices (CCW when viewed from outside)
var FACES = [
  { verts: [V_TOP, V_FRONT, V_RIGHT],   name: "TFR" }, // 0 top-front
  { verts: [V_TOP, V_RIGHT, V_BACK],    name: "TRB" }, // 1 top-right
  { verts: [V_TOP, V_BACK, V_LEFT],     name: "TBL" }, // 2 top-back
  { verts: [V_TOP, V_LEFT, V_FRONT],    name: "TLF" }, // 3 top-left
  { verts: [V_BOTTOM, V_RIGHT, V_FRONT],name: "BRF" }, // 4 bot-front
  { verts: [V_BOTTOM, V_BACK, V_RIGHT], name: "BBR" }, // 5 bot-right
  { verts: [V_BOTTOM, V_LEFT, V_BACK],  name: "BLB" }, // 6 bot-back
  { verts: [V_BOTTOM, V_FRONT, V_LEFT], name: "BFL" }, // 7 bot-left
];

// Compute face normals (outward pointing)
for (var i = 0; i < FACES.length; i++) {
  var v = FACES[i].verts;
  var e1 = vec3sub(v[1], v[0]);
  var e2 = vec3sub(v[2], v[0]);
  FACES[i].normal = vec3norm(vec3cross(e1, e2));
}

// Turn axes: for each face, the axis is the face center (= average of vertices = normal direction)
// Each face's turning axis goes through the center of the octahedron and the face center.
function faceCenter(fi) {
  var v = FACES[fi].verts;
  return vec3scale(vec3add(vec3add(v[0], v[1]), v[2]), 1/3);
}

// ============================================================
// FTO State: track sticker colors
// ============================================================
// Each face has 9 stickers arranged in a triangle pattern:
//        0        <- corner (vertex of octahedron, corner piece sticker)
//       1 2       <- edge sticker, center sticker
//      3 4 5      <- center, edge, center
//     6 7 8 9     <- corner, center, center, corner (but this is wrong for 9...)
//
// Actually, let me reconsider. An FTO face has:
// - 3 corner piece stickers (at the 3 corners of the triangle)
// - 3 edge piece stickers (at the 3 edges, between corners)
// - 3 center piece stickers (filling the interior near each edge)
// Total: 9 stickers per face... but wait:
// The problem says 24 centers total, 24/8 = 3 per face. 
// 12 edges total, each has 2 stickers, so 24 edge stickers / 8 faces = 3 per face.
// 6 corners total, each has 4 stickers, so 24 corner stickers / 8 faces = 3 per face.
// So: 3 + 3 + 3 = 9 stickers per face. ✓

// Sticker layout on each triangular face (viewed from outside):
//
//         C0           <- corner sticker
//        /  \
//      E0    E2        <- edge stickers
//      / \  / \
//    T0  T1  T2        <- center (triangle) stickers
//    /  \/ \/  \
//  C1---E1---C2        <- corner stickers, edge sticker
//
// Index mapping per face: [C0, E0, E2, T0, T1, T2, C1, E1, C2]
//   0: corner at vertex 0 of face
//   1: edge between vertex 0 and vertex 1
//   2: edge between vertex 0 and vertex 2
//   3: center near vertex 1
//   4: center in middle
//   5: center near vertex 2
//   6: corner at vertex 1
//   7: edge between vertex 1 and vertex 2
//   8: corner at vertex 2

// When a face turns by 120° CW (looking from outside):
// Corners rotate: 0 -> 8 -> 6 -> 0
// Edges rotate:   1 -> 2, 2 -> 7, 7 -> 1  (CW)  -- wait, need to reconsider
// Actually: 1->5->6 ... no.
//
// Let me define a clearer layout. For a triangular face with vertices A, B, C:
//
//         A
//        / \
//       a   c        a=edge(A,B), c=edge(A,C)
//      / \ / \
//     x   y   z      x=center near B, y=center middle, z=center near C  
//    / \ / \ / \
//   B---b---C        b=edge(B,C)
//
// Sticker indices on this face:
//   0 = A (corner)
//   1 = a (edge AB)
//   2 = c (edge AC)
//   3 = x (center near B)
//   4 = y (center middle)
//   5 = z (center near C)
//   6 = B (corner)
//   7 = b (edge BC)
//   8 = C (corner)
//
// A 120° CW rotation (looking from outside) maps:
//   A -> C -> B -> A    so  0 -> 8 -> 6 -> 0
//   a -> c (since AB edge becomes CA edge direction)
//   Wait, CW 120° around center: A->B is not right.
//   
// Let me think about this differently. A CW 120° rotation of the triangle 
// (when viewed from outside, i.e., looking at the face):
//   Vertex A goes to where B was, B goes to where C was, C goes to where A was.
//   So: A->B->C->A  (this is CW for a triangle ABC ordered CCW)
//
// Mapping:
//   0(A) -> 6(B)    
//   6(B) -> 8(C)
//   8(C) -> 0(A)
//   1(edge AB) -> 7(edge BC)
//   7(edge BC) -> 2(edge CA)
//   2(edge CA) -> 1(edge AB)
//   3(center near B) -> 5(center near C)
//   5(center near C) -> 4(center middle)... 
//   Hmm, that doesn't seem right either.
//
// Actually for the centers: when we rotate 120° CW:
//   The center piece near B moves to where center near C was
//   The center piece near C moves to where center near A was (= middle?)
//   No wait - there are 3 centers per face.
//
// Let me reconsider the center positions:
//   3 = center adjacent to edge AB and vertex B
//   4 = center adjacent to edge BC and vertex B ... no, that gives 2 near B.
//
// Better approach: The face is divided into 9 small triangles:
//         /\
//        /0 \
//       /----\
//      /1 \2 /3\
//     /----\/----\
//    /4 \5 /6 \7 /8\
//   /----\/----\/----\
//
// Wait, 9 small triangles in a triangle of side 3 would be 9 = 3² small triangles.
// But actually a triangle subdivided into rows gives:
// Row 0 (top): 1 triangle
// Row 1: 3 triangles  
// Row 2: 5 triangles
// Total: 9 triangles ✓ (for subdivision level 3)
//
// But FTO doesn't subdivide that way. Let me think about the actual FTO geometry.
//
// In an FTO, each face has exactly 9 visible stickers:
// - 3 corner piece stickers (triangular, pointing inward from each vertex)
// - 3 edge piece stickers (diamond-shaped but showing a triangular part on each face)
// - 3 center piece stickers (triangular, in the middle area)
//
// The layout looks like this (subdivision into 9 small triangles):
//         /\
//        /c0\          <- corner 0 (at top vertex)
//       /----\
//      /e0\cn0/e2\     <- edge 0 (left), center 0 (up-pointing), edge 2 (right)
//     /----\/----\
//    /c1\cn1/cn2\c2\   <- corner 1, center 1 (up-pointing), center 2 (up-pointing), corner 2
//   /----\/----\/----\   <- but this is 5 triangles... 
//
// Hmm, for a triangular grid of "order 3" (3 small triangles per edge):
// Row 0: 1 up-triangle                               = 1
// Row 1: 1 up-triangle, 1 down-triangle, 1 up-tri    = 3
// Row 2: 1 up, 1 down, 1 up, 1 down, 1 up            = 5
// Total: 9 triangles ✓
//
// Labeling (U = up-pointing, D = down-pointing):
//         /\
//        / U0\
//       /-----\
//      / U1\ D0/ U2\
//     /-----\/-----\
//    / U3\ D1/ U4\ D2/ U5\
//   /-----\/-----\/-----\
//
// Hmm wait, that's wrong. Let me count again:
// For side length 3, we have 3² = 9 small triangles.
// Row 0 (1 unit from top): 1 up-pointing
// Row 1 (1 unit): 2 up-pointing + 1 down-pointing = 3
// Row 2 (1 unit): 3 up-pointing + 2 down-pointing = 5
// Total: 1 + 3 + 5 = 9 ✓
//
// Visual layout:
//           /\
//          / 0 \           <- up-pointing (corner sticker for top vertex)
//         /-----\
//        / 1 \2/ 3 \       <- 1=up (edge), 2=down (center), 3=up (edge)
//       /-----\/-----\
//      / 4 \5/ 6 \7/ 8 \   <- 4=up (corner), 5=down (center), 6=up (edge), 7=down (center), 8=up (corner)
//     /-----\/-----\/-----\
//
// Piece types:
//   0 = corner (top vertex)
//   1 = edge (between top and bottom-left vertices)
//   2 = center (down-pointing, middle-ish)
//   3 = edge (between top and bottom-right vertices)
//   4 = corner (bottom-left vertex)
//   5 = center (down-pointing)
//   6 = edge (between bottom-left and bottom-right vertices)
//   7 = center (down-pointing)
//   8 = corner (bottom-right vertex)
//
// CW 120° rotation (viewed from outside) maps:
//   0 -> 8 -> 4 -> 0  (corners cycle)
//   1 -> 3 -> 6 -> 1  (edges cycle) Wait: 1(left edge) -> 3 is not CW...
//
// For CW rotation: top goes to bottom-right direction.
//   0 -> 4   (top vertex goes to bottom-left position)  
//   No wait, CW means top goes to bottom-right when viewed from outside.
//   
// Let me define CW as: looking at the face from outside, rotate clockwise.
// For triangle with top vertex at top, CW means:
//   Top vertex -> Bottom-right vertex -> Bottom-left vertex -> Top vertex
//   So: 0 -> 8 -> 4 -> 0
//   
//   Left edge -> Bottom edge -> Right edge -> Left edge  (CW)
//   So: 1 -> 6 -> 3 -> 1
//   
//   Centers (they are down-pointing triangles):
//   2 -> 7 -> 5 -> 2
//
// OK! So the CW permutation for a face is:
//   (0, 8, 4)(1, 6, 3)(2, 7, 5)
//
// And the affected stickers on ADJACENT faces also need to cycle.
//
// This is getting complex. Let me implement this properly.

// State: 8 faces × 9 stickers = 72 sticker values
// stickers[face][position] = color index (0-7)
var stickers = [];
var moveCount = 0;

function initState() {
  stickers = [];
  for (var f = 0; f < 8; f++) {
    stickers[f] = [];
    for (var s = 0; s < 9; s++) {
      stickers[f][s] = f;
    }
  }
  moveCount = 0;
  updateMoveCounter();
}

function updateMoveCounter() {
  document.getElementById("move-counter").textContent = "Moves: " + moveCount;
}

// ============================================================
// FTO Turn Logic
// ============================================================
// For each of the 8 faces, we need:
// 1. The on-face permutation (3 cycles of 3)
// 2. The adjacent sticker cycles (pieces shared with neighboring faces)
//
// The octahedron faces and their vertex assignments:
//   Face 0 (TFR): verts = [Top, Front, Right]
//   Face 1 (TRB): verts = [Top, Right, Back]
//   Face 2 (TBL): verts = [Top, Back, Left]
//   Face 3 (TLF): verts = [Top, Left, Front]
//   Face 4 (BRF): verts = [Bottom, Right, Front]
//   Face 5 (BBR): verts = [Bottom, Back, Right]
//   Face 6 (BLB): verts = [Bottom, Left, Back]
//   Face 7 (BFL): verts = [Bottom, Front, Left]
//
// Adjacency: Each face shares an edge with 3 other faces.
// For face F with vertices [A, B, C]:
//   Edge AB is shared with face that also has vertices A and B
//   Edge BC is shared with face that also has vertices B and C
//   Edge AC is shared with face that also has vertices A and C
//
// Sticker positions on a face:
//   0 = corner at vertex A (up-pointing triangle at top)
//   1 = edge along AB (up-pointing triangle on left)
//   2 = center (down-pointing triangle, left of middle)
//   3 = edge along AC (up-pointing triangle on right)
//   4 = corner at vertex B (up-pointing triangle at bottom-left)
//   5 = center (down-pointing triangle, bottom-left)
//   6 = edge along BC (up-pointing triangle at bottom-middle)
//   7 = center (down-pointing triangle, bottom-right)
//   8 = corner at vertex C (up-pointing triangle at bottom-right)

// For each face, find its 3 adjacent faces and which stickers are affected
// when this face turns CW by 120°.

// Helper: find face index that contains both vertex v1 and v2 (other than face fi)
function findAdjacentFace(fi, v1, v2) {
  for (var i = 0; i < 8; i++) {
    if (i === fi) continue;
    var fv = FACES[i].verts;
    var has1 = false, has2 = false;
    for (var j = 0; j < 3; j++) {
      if (fv[j][0]===v1[0] && fv[j][1]===v1[1] && fv[j][2]===v1[2]) has1 = true;
      if (fv[j][0]===v2[0] && fv[j][1]===v2[1] && fv[j][2]===v2[2]) has2 = true;
    }
    if (has1 && has2) return i;
  }
  return -1;
}

// Helper: given a face and a vertex, which sticker index is the corner at that vertex?
function cornerIndexForVertex(fi, v) {
  var fv = FACES[fi].verts;
  for (var j = 0; j < 3; j++) {
    if (fv[j][0]===v[0] && fv[j][1]===v[1] && fv[j][2]===v[2]) {
      return j * 4; // vertex 0 -> sticker 0, vertex 1 -> sticker 4, vertex 2 -> sticker 8
    }
  }
  return -1;
}

// Helper: given a face and two vertices (defining a shared edge), return the 
// sticker indices on that face along that edge.
// Edge between vertex i and vertex j of the face:
//   Edge (v0,v1) = AB: stickers [0, 1, 2, 4] -> no wait, [1, 2, 4] minus corners
//   
// Let me define which stickers are on which edge more carefully.
// For face with vertices at positions 0,1,2 of the verts array:
//   Edge v0-v1 (top to bottom-left): stickers 1 (edge), 2 (center)
//   Edge v1-v2 (bottom-left to bottom-right): stickers 5 (center), 6 (edge), 7 (center)
//   Wait that's 3 stickers... 
//   Edge v0-v2 (top to bottom-right): stickers 3 (edge), ... 
//
// Hmm. When face F turns, which stickers on adjacent faces move?
// A 120° CW turn of face F affects:
// - All 9 stickers on face F itself (permuted)
// - Stickers on adjacent faces that are "attached" to the turning layer
//
// In an FTO, when a face turns, it moves:
// - The 3 corner pieces at the face's vertices
// - The 3 edge pieces at the face's edges
// - The 3 center pieces on the face
//
// A corner piece sits at a vertex and has stickers on all 4 faces meeting at that vertex.
// An edge piece sits on an edge of the octahedron and has stickers on the 2 faces sharing that edge.
// A center piece has a sticker only on this face.
//
// So when face F turns:
// ON face F: all 9 stickers permute as: (0,8,4)(3,6,1)(2,7,5) for CW
// ON adjacent faces:
//   - Corner pieces: each vertex of F is shared by 4 faces. The corner piece's stickers
//     on the other 3 faces (not F) rotate with the turn.
//   - Edge pieces: each edge of F is shared with 1 other face. The edge piece's sticker
//     on that other face moves to a different adjacent face's edge sticker position.
//
// This is the key complexity. Let me work out the adjacency carefully.
//
// For the FTO, when face F (with vertices A, B, C) turns CW by 120°:
//   Vertex A -> position of C
//   Vertex B -> position of A  
//   Vertex C -> position of B
//   Wait, I said CW maps: 0->8->4->0, meaning A->C->B->A, so:
//   The piece at A moves to where C was, piece at C moves to B, piece at B moves to A.
//
// Corner at vertex A: has stickers on F and on the 3 other faces at vertex A.
// After CW turn, this corner moves to vertex C position.
// The stickers on non-F faces need to move to the corresponding positions at vertex C.
//
// Let me define all adjacency data explicitly.

    var cyc = cycles[i];
    var a = cyc[0], b = cyc[1], c = cyc[2];

function applyCCW(cycles) {
  // Reverse of CW: piece at a moves to c, etc.
  for (var i = 0; i < cycles.length; i++) {
    var cyc = cycles[i];

    var tmp = stickers[a[0]][a[1]];

    stickers[b[0]][b[1]] = stickers[c[0]][c[1]];

  moveCount++;
  updateMoveCounter();
}

// Scramble
function scramble(moves) {
  moves = moves || 30;
  for (var i = 0; i < moves; i++) {
    var face = Math.floor(Math.random() * 8);
    if (Math.random() < 0.5) {
      applyCW(TURN_DATA[face]);
    } else {
      applyCCW(TURN_DATA[face]);
    }
  }
  moveCount = 0;
  updateMoveCounter();
}

// ============================================================
// 3D Rendering with WebGL
// ============================================================
var canvas, gl;
var projMatrix, viewMatrix;
var shaderProgram;
var meshBuffers = []; // one per renderable triangle

// Camera
var camTheta = 0.6;  // horizontal angle
var camPhi = 0.4;    // vertical angle  
var camDist = 4.5;

function getCameraPos() {
  return [
    camDist * Math.cos(camPhi) * Math.sin(camTheta),
    camDist * Math.sin(camPhi),
    camDist * Math.cos(camPhi) * Math.cos(camTheta)
  ];
}

// Vertex shader
var VS_SRC = [
  "attribute vec3 aPosition;",
  "attribute vec3 aNormal;",
  "attribute vec3 aColor;",
  "uniform mat4 uProj;",
  "uniform mat4 uView;",
  "varying vec3 vColor;",
  "varying vec3 vNormal;",
  "varying vec3 vPos;",
  "void main() {",
  "  vColor = aColor;",
  "  vNormal = aNormal;",
  "  vPos = aPosition;",
  "  gl_Position = uProj * uView * vec4(aPosition, 1.0);",
  "}"
].join("\n");

// Fragment shader
var FS_SRC = [
  "precision mediump float;",
  "varying vec3 vColor;",
  "varying vec3 vNormal;",
  "varying vec3 vPos;",
  "uniform vec3 uLightDir;",
  "void main() {",
  "  vec3 n = normalize(vNormal);",
  "  float diff = max(dot(n, uLightDir), 0.0);",
  "  float amb = 0.35;",
  "  vec3 col = vColor * (amb + (1.0 - amb) * diff);",
  "  gl_FragColor = vec4(col, 1.0);",
  "}"
].join("\n");

function initGL() {
  canvas = document.createElement("canvas");
  canvas.style.position = "absolute";
  canvas.style.top = "0";
  canvas.style.left = "0";
  document.body.appendChild(canvas);
  
  gl = canvas.getContext("webgl", { antialias: true, alpha: false });
  if (!gl) { alert("WebGL not supported"); return; }
  
  gl.clearColor(0.96, 0.96, 0.96, 1);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  
  // Compile shaders
  var vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, VS_SRC);
  gl.compileShader(vs);
  
  var fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, FS_SRC);
  gl.compileShader(fs);
  
  shaderProgram = gl.createProgram();
  gl.attachShader(shaderProgram, vs);
  gl.attachShader(shaderProgram, fs);
  gl.linkProgram(shaderProgram);
  gl.useProgram(shaderProgram);
  
  resize();
  window.addEventListener("resize", resize);
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
  projMatrix = mat4perspective(Math.PI / 4, canvas.width / canvas.height, 0.1, 100);
}

// ============================================================
// Build 3D Geometry for the FTO
// ============================================================
// Each face of the octahedron is subdivided into 9 small triangles.
// We need to compute the 3D position of each small triangle.

// For a face with vertices P0, P1, P2 (in 3D), we subdivide the triangle 
// into a grid of 3 rows.
// Using barycentric coordinates, the vertices of the subdivision grid are:
//   (i, j, k) where i+j+k = 3 and i,j,k >= 0
//   The 3D position is: (i*P0 + j*P1 + k*P2) / 3

function subdivPoint(p0, p1, p2, i, j, k) {
  return vec3scale(vec3add(vec3add(vec3scale(p0, i), vec3scale(p1, j)), vec3scale(p2, k)), 1/3);
}

// The 9 small triangles in order [0..8]:
// Up-pointing triangles (same orientation as big triangle):
//   0: (3,0,0),(2,1,0),(2,0,1)  -- top vertex, center of edges
//   Hmm, let me use a systematic approach.
//
// Grid points: (i,j,k) with i+j+k=3
//   Row 0 (i=3): (3,0,0) = P0
//   Row 1 (i=2): (2,1,0), (2,0,1)
//   Row 2 (i=1): (1,2,0), (1,1,1), (1,0,2)
//   Row 3 (i=0): (0,3,0)=P1, (0,2,1), (0,1,2), (0,0,3)=P2
//
// Small triangles (9 total):
// Up-pointing (4):
//   T0: (3,0,0), (2,1,0), (2,0,1)
//   T1: (2,1,0), (1,2,0), (1,1,1)
//   T2: (2,0,1), (1,1,1), (1,0,2)
//   T3: (1,2,0), (0,3,0), (0,2,1)
//   T4: (1,1,1), (0,2,1), (0,1,2)
//   T5: (1,0,2), (0,1,2), (0,0,3)
// Down-pointing (3):
//   T6: (2,1,0), (2,0,1), (1,1,1)
//   T7: (1,2,0), (1,1,1), (0,2,1)
//   T8: (1,1,1), (1,0,2), (0,1,2)
//
// Wait, that's 6 up + 3 down = 9. ✓
//
// Now map these to our sticker indices:
//   Sticker 0 (corner at v0): T0
//   Sticker 1 (edge v0-v1):   T1
//   Sticker 2 (center):       T6 (down-pointing, between v0 side edges)
//   Sticker 3 (edge v0-v2):   T2
//   Sticker 4 (corner at v1): T3
//   Sticker 5 (center):       T7 (down-pointing, near v1)
//   Sticker 6 (edge v1-v2):   T4
//   Sticker 7 (center):       T8 (down-pointing, near v2)
//   Sticker 8 (corner at v2): T5
//
// Let me verify:
//   T0 = top triangle = corner at v0 ✓ (sticker 0)
//   T1 = left side, between v0 and v1 = edge v0-v1 ✓ (sticker 1)
//   T2 = right side, between v0 and v2 = edge v0-v2 ✓ (sticker 3)
//   T3 = bottom-left = corner at v1 ✓ (sticker 4)
//   T4 = bottom-middle = edge v1-v2 ✓ (sticker 6)
//   T5 = bottom-right = corner at v2 ✓ (sticker 8)
//   T6 = down-pointing center near top = center ✓ (sticker 2)
//   T7 = down-pointing center near v1 = center ✓ (sticker 5)
//   T8 = down-pointing center near v2 = center ✓ (sticker 7)

var SUBDIV_TRIS = [
  // [stickerIndex, baryA, baryB, baryC] for each vertex of the small triangle
  // sticker 0: corner v0
  { idx: 0, verts: [[3,0,0],[2,1,0],[2,0,1]] },
  // sticker 1: edge v0-v1
  { idx: 1, verts: [[2,1,0],[1,2,0],[1,1,1]] },
  // sticker 2: center (down-pointing)
  { idx: 2, verts: [[2,1,0],[2,0,1],[1,1,1]] },
  // sticker 3: edge v0-v2
  { idx: 3, verts: [[2,0,1],[1,1,1],[1,0,2]] },
  // sticker 4: corner v1
  { idx: 4, verts: [[1,2,0],[0,3,0],[0,2,1]] },
  // sticker 5: center (down-pointing)
  { idx: 5, verts: [[1,2,0],[1,1,1],[0,2,1]] },
  // sticker 6: edge v1-v2
  { idx: 6, verts: [[1,1,1],[0,2,1],[0,1,2]] },
  // sticker 7: center (down-pointing)
  { idx: 7, verts: [[1,1,1],[1,0,2],[0,1,2]] },
  // sticker 8: corner v2
  { idx: 8, verts: [[1,0,2],[0,1,2],[0,0,3]] },
];

// Scale factor: push sticker slightly outward from octahedron surface for visibility
var STICKER_SCALE = 0.97;
var GAP = 0.008; // gap between stickers

function buildFaceGeometry(fi) {
  var fv = FACE_VERTS[fi];
  var P0 = VERT[fv[0]], P1 = VERT[fv[1]], P2 = VERT[fv[2]];
  var normal = FACES[fi].normal;
  
  var tris = [];
  for (var si = 0; si < 9; si++) {
    var sd = SUBDIV_TRIS[si];
    var v0 = subdivPoint(P0, P1, P2, sd.verts[0][0], sd.verts[0][1], sd.verts[0][2]);
    var v1 = subdivPoint(P0, P1, P2, sd.verts[1][0], sd.verts[1][1], sd.verts[1][2]);
    var v2 = subdivPoint(P0, P1, P2, sd.verts[2][0], sd.verts[2][1], sd.verts[2][2]);
    
    // Shrink toward center for gap effect
    var center = vec3scale(vec3add(vec3add(v0, v1), v2), 1/3);
    v0 = vec3lerp(center, v0, STICKER_SCALE);
    v1 = vec3lerp(center, v1, STICKER_SCALE);
    v2 = vec3lerp(center, v2, STICKER_SCALE);
    
    // Push slightly outward
    v0 = vec3add(v0, vec3scale(normal, GAP));
    v1 = vec3add(v1, vec3scale(normal, GAP));
    v2 = vec3add(v2, vec3scale(normal, GAP));
    
    tris.push({ face: fi, sticker: sd.idx, verts: [v0, v1, v2], normal: normal });
  }
  return tris;
}

// Also build the octahedron "body" (dark triangles underneath stickers)
function buildBodyGeometry() {
  var tris = [];
  for (var fi = 0; fi < 8; fi++) {
    var fv = FACE_VERTS[fi];
    var P0 = VERT[fv[0]], P1 = VERT[fv[1]], P2 = VERT[fv[2]];
    var normal = FACES[fi].normal;
    tris.push({ verts: [P0, P1, P2], normal: normal, color: [0.15, 0.15, 0.15] });
  }
  return tris;
}

// ============================================================
// Rendering
// ============================================================
var allStickerTris = [];
var bodyTris = [];

function buildAllGeometry() {
  allStickerTris = [];
  for (var fi = 0; fi < 8; fi++) {
    allStickerTris = allStickerTris.concat(buildFaceGeometry(fi));
  }
  bodyTris = buildBodyGeometry();
}

function render() {
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  
  var eye = getCameraPos();
  viewMatrix = mat4lookAt(eye, [0,0,0], [0,1,0]);
  
  var uProj = gl.getUniformLocation(shaderProgram, "uProj");
  var uView = gl.getUniformLocation(shaderProgram, "uView");
  var uLight = gl.getUniformLocation(shaderProgram, "uLightDir");
  
  gl.uniformMatrix4fv(uProj, false, projMatrix);
  gl.uniformMatrix4fv(uView, false, viewMatrix);
  gl.uniform3fv(uLight, vec3norm([0.5, 1.0, 0.8]));
  
  var aPos = gl.getAttribLocation(shaderProgram, "aPosition");
  var aNorm = gl.getAttribLocation(shaderProgram, "aNormal");
  var aCol = gl.getAttribLocation(shaderProgram, "aColor");
  
  gl.enableVertexAttribArray(aPos);
  gl.enableVertexAttribArray(aNorm);
  gl.enableVertexAttribArray(aCol);
  
  // Draw body
  drawTriangles(bodyTris, null, aPos, aNorm, aCol);
  
  // Draw stickers with animation
  drawTriangles(allStickerTris, stickers, aPos, aNorm, aCol);
}

function drawTriangles(tris, stickerState, aPos, aNorm, aCol) {
  var positions = [];
  var normals = [];
  var colors = [];
  
  for (var i = 0; i < tris.length; i++) {
    var t = tris[i];
    var col;
    if (stickerState) {
      var colorIdx = stickerState[t.face][t.sticker];
      col = hexToRGB(FTO_COLORS[colorIdx]);
    } else {
      col = t.color;
    }
    
    var v = t.verts;
    var n = t.normal;
    
    // Apply animation rotation if this sticker is part of the animating face
    if (animating && stickerState) {
      var shouldAnimate = false;
      if (t.face === animFace) {
        shouldAnimate = true;
      } else {
        // Check if this sticker is in any off-face cycle
        var cycles = TURN_DATA[animFace];
        for (var ci = 3; ci < cycles.length; ci++) { // off-face cycles start at index 3
          for (var cj = 0; cj < 3; cj++) {
            if (cycles[ci][cj][0] === t.face && cycles[ci][cj][1] === t.sticker) {
              shouldAnimate = true;
              break;
            }
          }
          if (shouldAnimate) break;
        }
      }
      
      if (shouldAnimate) {
        var axis = FACES[animFace].normal;
        var angle = animDir * TURN_ANGLE * animProgress;
        v = [
          rotatePoint(v[0], axis, angle),
          rotatePoint(v[1], axis, angle),
          rotatePoint(v[2], axis, angle)
        ];
        n = rotatePoint(n, axis, angle);
      }
    }
    
    for (var j = 0; j < 3; j++) {
      positions.push(v[j][0], v[j][1], v[j][2]);
      normals.push(n[0], n[1], n[2]);
      colors.push(col[0], col[1], col[2]);
    }
  }
  
  var posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.DYNAMIC_DRAW);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
  
  var normBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(normals), gl.DYNAMIC_DRAW);
  gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 0, 0);
  
  var colBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.DYNAMIC_DRAW);
  gl.vertexAttribPointer(aCol, 3, gl.FLOAT, false, 0, 0);
  
  gl.drawArrays(gl.TRIANGLES, 0, positions.length / 3);
  
  gl.deleteBuffer(posBuf);
  gl.deleteBuffer(normBuf);
  gl.deleteBuffer(colBuf);
}

// ============================================================
// Animation
// ============================================================
var animating = false;
var animFace = -1;
var animDir = 1; // 1 = CW, -1 = CCW
var animProgress = 0;
var ANIM_DURATION = 300; // ms
var animStartTime = 0;

function animateTurn(face, dir) {
  if (animating) return;
  animating = true;
  animFace = face;
  animDir = dir;
  animProgress = 0;
  animStartTime = performance.now();
}

function updateAnimation() {
  if (!animating) return;
  var elapsed = performance.now() - animStartTime;
  animProgress = Math.min(elapsed / ANIM_DURATION, 1);
  
  // Ease in-out
  animProgress = animProgress < 0.5 
    ? 2 * animProgress * animProgress 
    : 1 - Math.pow(-2 * animProgress + 2, 2) / 2;
  
  if (elapsed >= ANIM_DURATION) {
    animating = false;
    animProgress = 0;
    // Apply the actual turn to state
    if (animDir > 0) turnFaceCW(animFace);
    else turnFaceCCW(animFace);
  }
}

// ============================================================
// Interaction: orbit camera + face clicking
// ============================================================
var isDragging = false;
var dragStartX, dragStartY;
var dragStartTheta, dragStartPhi;
var dragMoved = false;

function onPointerDown(e) {
  e.preventDefault();
  var x = e.clientX || (e.touches && e.touches[0].clientX);
  var y = e.clientY || (e.touches && e.touches[0].clientY);
  isDragging = true;
  dragMoved = false;
  dragStartX = x;
  dragStartY = y;
  dragStartTheta = camTheta;
  dragStartPhi = camPhi;
}

function onPointerMove(e) {
  if (!isDragging) return;
  e.preventDefault();
  var x = e.clientX || (e.touches && e.touches[0].clientX);
  var y = e.clientY || (e.touches && e.touches[0].clientY);
  var dx = x - dragStartX;
  var dy = y - dragStartY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
  camTheta = dragStartTheta - dx * 0.01;
  camPhi = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, dragStartPhi + dy * 0.01));
}

function onPointerUp(e) {
  isDragging = false;
  if (!dragMoved && !animating) {
    var x, y;
    if (e.changedTouches) {
      x = e.changedTouches[0].clientX;
      y = e.changedTouches[0].clientY;
    } else {
      x = e.clientX;
      y = e.clientY;
    }
    handleClick(x, y, e.button === 2 || e.shiftKey);
  }
}

function handleClick(screenX, screenY, isRight) {
  // Ray-cast to find which face was clicked
  var ndcX = (screenX / canvas.width) * 2 - 1;
  var ndcY = 1 - (screenY / canvas.height) * 2;
  
  // Unproject
  var invProj = invertMat4(projMatrix);
  var invView = invertMat4(viewMatrix);
  
  var clipNear = [ndcX, ndcY, -1];
  var clipFar = [ndcX, ndcY, 1];
  
  var eyeNear = mat4transform(invProj, clipNear);
  var eyeFar = mat4transform(invProj, clipFar);
  
  var worldNear = mat4transform(invView, eyeNear);
  var worldFar = mat4transform(invView, eyeFar);
  
  var rayOrigin = worldNear;
  var rayDir = vec3norm(vec3sub(worldFar, worldNear));
  
  // Test intersection with each face
  var bestT = Infinity;
  var bestFace = -1;
  
  for (var fi = 0; fi < 8; fi++) {
    var fv = FACE_VERTS[fi];
    var P0 = VERT[fv[0]], P1 = VERT[fv[1]], P2 = VERT[fv[2]];
    var t = rayTriangleIntersect(rayOrigin, rayDir, P0, P1, P2);
    if (t !== null && t < bestT) {
      bestT = t;
      bestFace = fi;
    }
  }
  
  if (bestFace >= 0) {
    animateTurn(bestFace, isRight ? -1 : 1);
  }
}

// Möller–Trumbore ray-triangle intersection
function rayTriangleIntersect(origin, dir, v0, v1, v2) {
  var e1 = vec3sub(v1, v0);
  var e2 = vec3sub(v2, v0);
  var h = vec3cross(dir, e2);
  var a = vec3dot(e1, h);
  if (Math.abs(a) < 1e-8) return null;
  var f = 1 / a;
  var s = vec3sub(origin, v0);
  var u = f * vec3dot(s, h);
  if (u < 0 || u > 1) return null;
  var q = vec3cross(s, e1);
  var v = f * vec3dot(dir, q);
  if (v < 0 || u + v > 1) return null;
  var t = f * vec3dot(e2, q);
  return t > 0.001 ? t : null;
}

// Simple 4x4 matrix inverse (general)
function invertMat4(m) {
  var inv = new Float32Array(16);
  inv[0]  =  m[5]*m[10]*m[15]-m[5]*m[11]*m[14]-m[9]*m[6]*m[15]+m[9]*m[7]*m[14]+m[13]*m[6]*m[11]-m[13]*m[7]*m[10];
  inv[4]  = -m[4]*m[10]*m[15]+m[4]*m[11]*m[14]+m[8]*m[6]*m[15]-m[8]*m[7]*m[14]-m[12]*m[6]*m[11]+m[12]*m[7]*m[10];
  inv[8]  =  m[4]*m[9]*m[15]-m[4]*m[11]*m[13]-m[8]*m[5]*m[15]+m[8]*m[7]*m[13]+m[12]*m[5]*m[11]-m[12]*m[7]*m[9];
  inv[12] = -m[4]*m[9]*m[14]+m[4]*m[10]*m[13]+m[8]*m[5]*m[14]-m[8]*m[6]*m[13]-m[12]*m[5]*m[10]+m[12]*m[6]*m[9];
  inv[1]  = -m[1]*m[10]*m[15]+m[1]*m[11]*m[14]+m[9]*m[2]*m[15]-m[9]*m[3]*m[14]-m[13]*m[2]*m[11]+m[13]*m[3]*m[10];
  inv[5]  =  m[0]*m[10]*m[15]-m[0]*m[11]*m[14]-m[8]*m[2]*m[15]+m[8]*m[3]*m[14]+m[12]*m[2]*m[11]-m[12]*m[3]*m[10];
  inv[9]  = -m[0]*m[9]*m[15]+m[0]*m[11]*m[13]+m[8]*m[1]*m[15]-m[8]*m[3]*m[13]-m[12]*m[1]*m[11]+m[12]*m[3]*m[9];
  inv[13] =  m[0]*m[9]*m[14]-m[0]*m[10]*m[13]-m[8]*m[1]*m[14]+m[8]*m[2]*m[13]+m[12]*m[1]*m[10]-m[12]*m[2]*m[9];
  inv[2]  =  m[1]*m[6]*m[15]-m[1]*m[7]*m[14]-m[5]*m[2]*m[15]+m[5]*m[3]*m[14]+m[13]*m[2]*m[7]-m[13]*m[3]*m[6];
  inv[6]  = -m[0]*m[6]*m[15]+m[0]*m[7]*m[14]+m[4]*m[2]*m[15]-m[4]*m[3]*m[14]-m[12]*m[2]*m[7]+m[12]*m[3]*m[6];
  inv[10] =  m[0]*m[5]*m[15]-m[0]*m[7]*m[13]-m[4]*m[1]*m[15]+m[4]*m[3]*m[13]+m[12]*m[1]*m[7]-m[12]*m[3]*m[5];
  inv[14] = -m[0]*m[5]*m[14]+m[0]*m[6]*m[13]+m[4]*m[1]*m[14]-m[4]*m[2]*m[13]-m[12]*m[1]*m[6]+m[12]*m[2]*m[5];
  inv[3]  = -m[1]*m[6]*m[11]+m[1]*m[7]*m[10]+m[5]*m[2]*m[11]-m[5]*m[3]*m[10]-m[9]*m[2]*m[7]+m[9]*m[3]*m[6];
  inv[7]  =  m[0]*m[6]*m[11]-m[0]*m[7]*m[10]-m[4]*m[2]*m[11]+m[4]*m[3]*m[10]+m[8]*m[2]*m[7]-m[8]*m[3]*m[6];
  inv[11] = -m[0]*m[5]*m[11]+m[0]*m[7]*m[9]+m[4]*m[1]*m[11]-m[4]*m[3]*m[9]-m[8]*m[1]*m[7]+m[8]*m[3]*m[5];
  inv[15] =  m[0]*m[5]*m[10]-m[0]*m[6]*m[9]-m[4]*m[1]*m[10]+m[4]*m[2]*m[9]+m[8]*m[1]*m[6]-m[8]*m[2]*m[5];
  
  var det = m[0]*inv[0]+m[1]*inv[4]+m[2]*inv[8]+m[3]*inv[12];
  if (Math.abs(det) < 1e-10) return mat4();
  det = 1 / det;
  for (var i = 0; i < 16; i++) inv[i] *= det;
  return inv;
}

// ============================================================
// Main loop
// ============================================================
function mainLoop() {
  updateAnimation();
  render();
  requestAnimationFrame(mainLoop);
}

// ============================================================
// Scramble exposed for Android bridge
// ============================================================
window.ftoScramble = function() {
  if (animating) return;
  initState();
  scramble(30);
};

// ============================================================
// Init
// ============================================================
function init() {
  initState();
  initGL();
  buildAllGeometry();
  
  // Input
  canvas.addEventListener("mousedown", onPointerDown);
  canvas.addEventListener("mousemove", onPointerMove);
  canvas.addEventListener("mouseup", onPointerUp);
  canvas.addEventListener("touchstart", onPointerDown, { passive: false });
  canvas.addEventListener("touchmove", onPointerMove, { passive: false });
  canvas.addEventListener("touchend", onPointerUp, { passive: false });
  canvas.addEventListener("contextmenu", function(e) { e.preventDefault(); });
  
  // Start scrambled
  scramble(30);
  
  mainLoop();
}

window.addEventListener("DOMContentLoaded", init);
</script>
